<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #f9f9f9;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px 0;
      color: #333;
    }
    p {
      margin: 8px 0;
      font-size: 14px;
      color: #555;
    }
    .status {
      padding: 12px;
      border-radius: 6px;
      background-color: #e8f5e9;
      border-left: 4px solid #4caf50;
      margin-top: 12px;
    }
    .status.active {
      color: #2e7d32;
    }
  </style>
</head>
<body>
  <h1>ChatGPT Em Dash Remover</h1>
  <p>Automatically removes em dashes (—) from ChatGPT responses when you copy them.</p>
  <p>Features:</p>
  <ul>
    <li>Replaces em dashes with commas</li>
    <li>Shows check animation when copying</li>
    <li>Removes "ChatGPT said:" prefix</li>
  </ul>
  <div class="status active">
    ✓ Extension is active on this page
  </div>
</body>
</html>
